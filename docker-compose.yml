services:
  db:
    image: postgis/postgis:16-3.4
    container_name: utkal_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: utkal_secure_password_2026
      POSTGRES_DB: utkal_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utkal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: utkal_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: utkal_secure_password_2026
      POSTGRES_DB: utkal_db
      SECRET_KEY: utkal-local-production-secret-key-2026
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: utkal_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres_data:
